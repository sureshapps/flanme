<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><meta name="description" content="SURESH. A chrome letter morph and light-driven name reveal."><title>SURESH — In motion</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a href="./" aria-label="Suresh home">S<span class="brand-dot">.</span></a><span>CHROME STUDY <i>001</i></span><button id="sound" class="sound-toggle" aria-label="Enable music and replay animation" aria-pressed="false" disabled><span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="sound-label">SOUND OFF</span></button></header>
<main><div class="caption"><span>FORM / LIGHT / IDENTITY</span><span id="phase">01 — THE MORPH</span></div>
<svg id="stage" viewBox="0 0 1600 900" role="img" aria-label="Chrome SVG shapes morph through the letters S U R E S H, followed by the full SURESH artwork reveal">
<defs>
<linearGradient id="chrome" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#11141d"/><stop offset=".08" stop-color="#f5fbff"/><stop offset=".16" stop-color="#8297be"/><stop offset=".25" stop-color="#fff"/><stop offset=".42" stop-color="#b5c7ff"/><stop offset=".49" stop-color="#f7fbff"/><stop offset=".51" stop-color="#303842"/><stop offset=".55" stop-color="#d7e3ff"/><stop offset=".72" stop-color="#788dd0"/><stop offset=".89" stop-color="#faffff"/><stop offset="1" stop-color="#384255"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#f4faff"/><stop offset=".3" stop-color="#6a7484"/><stop offset=".5" stop-color="#fff"/><stop offset=".8" stop-color="#a2b6f8"/><stop offset="1" stop-color="#fff"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="bevel" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/><feSpecularLighting in="blur" surfaceScale="12" specularConstant="1.3" specularExponent="32" lighting-color="#ffffff" result="light"><fePointLight x="200" y="80" z="180"/></feSpecularLighting><feComposite in="light" in2="SourceAlpha" operator="in" result="shine"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shine"/></feMerge></filter>
<path id="flight" d="M100 260 C450 70 1150 460 1500 260 S1130 630 800 450 S100 370 100 540 S700 780 1500 630"/>
<mask id="reveal"><path id="brush" d="M100 260 C450 70 1150 460 1500 260 S1130 630 800 450 S100 370 100 540 S700 780 1500 630" fill="none" stroke="white" stroke-width="460" stroke-linecap="round"/></mask>
</defs>
<g id="letter" transform="translate(400 50)"><path id="shadow" fill="none" stroke="#637dc7" stroke-width="18" opacity=".18" filter="url(#glow)"/><path id="shape" fill="url(#chrome)" stroke="url(#edge)" stroke-width="7" stroke-linejoin="round" filter="url(#bevel)"/><path id="outline" fill="none" stroke="white" stroke-width="1" opacity=".6"/></g>
<g id="final"><image href="assets/suresh.png" x="100" y="125" width="1400" height="650" preserveAspectRatio="xMidYMid meet" mask="url(#reveal)"/></g>
<g id="comet"><circle r="32" fill="#a3bbff" filter="url(#glow)" opacity=".8"/><circle r="5" fill="white"/><path d="M-45 0H45M0-45V45" stroke="white" stroke-width="1.5"/><path d="M-19-19 19 19M-19 19 19-19" stroke="#c3d4ff"/></g>
<g id="stars" fill="white"></g>
</svg>
<div class="letter-line" aria-label="Letter sequence"><span>S</span><span>U</span><span>R</span><span>E</span><span>S</span><span>H</span></div>
<div class="final-title">SIX LETTERS. ONE SIGNATURE.</div>
</main>
<footer><div class="controls"><button id="play" aria-label="Pause animation">Ⅱ</button><button id="replay" aria-label="Replay animation">↻ <span>REPLAY</span></button></div><div class="scrub"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Animation progress"><div><span id="time">00.0</span><span>SVG MORPH → MOTION PATH</span><span id="duration">00.0</span></div></div><span class="edition">SURESH <span>© 2026</span></span></footer>
<div id="error" hidden>Animation could not load. Please refresh to retry.</div>
<script src="assets/gsap.min.js"></script><script src="assets/MorphSVGPlugin.min.js"></script><script src="assets/MotionPathPlugin.min.js"></script><script src="sound.js"></script><script src="app.js"></script>
</body></html>
