<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- no zoom: pinch / double-tap zoom is off; viewport-fit is left at default so notches never show white -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A window of coming enhancements. A future where carbon fiber, titanium, and human instinct align. Gateway to your augmented self." />

    <!-- installable app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Suresh" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Suresh" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="format-detection" content="telephone=no" />

    <!-- favicon, web icon, app icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/sureshapps/Skyra/refs/heads/main/public/Img1.webp" />
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/sureshapps/Skyra/refs/heads/main/public/Img2.webp" />
    <title>Suresh // DevOps</title>

    <!-- paints before React loads: no white flash, no page scroll, no zoom -->
    <style>
      html, body, #root {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; overscroll-behavior: none;
        background: #820d16;
      }
      html {
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      }
      body {
        position: fixed; inset: 0;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body>
    <noscript>This site needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // register the service worker in production builds only (skipped on the Vite dev server)
      if ('serviceWorker' in navigator && !document.querySelector('script[src*="@vite/client"]')) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
